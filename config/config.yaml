# Anemia Detection Configuration

data:
  root_dir: "dataset/Fingernails"
  image_extensions: ["jpg", "jpeg", "png"]
  test_split: 0.15
  random_seed: 42

training:
  model: "pyramid"  # Options: deit, pyramid, hybrid
  batch_size: 16
  epochs: 30
  learning_rate: 3.0e-5
  weight_decay: 0.05
  image_size: 224
  num_workers: 4
  early_stopping_patience: 5
  gradient_clip_norm: 1.0

model:
  deit:
    backbone: "deit_base_patch16_224"
    pretrained: true
    num_classes: 2
  pyramid:
    conv_channels: [64, 128, 256]
    transformer_dim: 128
    transformer_heads: 4
    num_classes: 2
  hybrid:
    backbone: "MobileNetV2"
    attention_heads: 4
    key_dim: 32
    dense_units: [128, 64]
    num_classes: 1

augmentation:
  rotation_range: 30
  horizontal_flip: true
  vertical_flip: true
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
  clahe:
    clip_limit: 3.0
    grid_size: [8, 8]

paths:
  checkpoints: "weights/"
  results: "results/"
  logs: "logs/"
